<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Katt — Create Account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a {
            color: #00e5ff;
            text-decoration: none;
            transition: color 0.2s;
        }

        a:hover {
            color: #7df3ff;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: #fff;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: -0.01em;
        }

        .nav-logo:hover {
            color: #fff;
        }

        .nav-logo-icon {
            width: 44px;
            height: 44px;
            flex-shrink: 0;
        }

        .nav-logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .contact-link {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .contact-link:hover {
            color: #00e5ff;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            padding: 48px 24px;
        }

        .logo {
            width: 112px;
            height: 112px;
            object-fit: contain;
        }

        .divider {
            width: 60px;
            height: 2px;
            background: #00e5ff;
        }

        .heading {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            text-align: center;
        }

        h1 {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(2.5rem, 8vw, 3.5rem);
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            line-height: 1;
        }

        .subtitle {
            font-size: clamp(0.8rem, 2.5vw, 0.95rem);
            font-weight: 300;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        form {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 8px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .field-label {
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.65);
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .label-row a {
            font-size: 0.75rem;
            letter-spacing: 0.06em;
        }

        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            height: 48px;
            padding: 0 16px;
            background: #0b0b0b;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 2px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            transition: border-color 0.2s;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        input:focus {
            outline: none;
            border-color: #00e5ff;
        }

        input[aria-invalid="true"] {
            border-color: #ff6b6b;
        }

        .password-wrap {
            position: relative;
        }

        .password-wrap input {
            padding-right: 52px;
        }

        .toggle-password {
            position: absolute;
            right: 2px;
            top: 2px;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.55);
            cursor: pointer;
            transition: color 0.2s;
        }

        .toggle-password:hover,
        .toggle-password[aria-pressed="true"] {
            color: #00e5ff;
        }

        .checkbox {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.65);
            cursor: pointer;
        }

        .checkbox input {
            width: 16px;
            height: 16px;
            accent-color: #00e5ff;
        }

        .submit {
            height: 52px;
            margin-top: 4px;
            background: #00e5ff;
            color: #000;
            border: none;
            border-radius: 2px;
            font-family: 'Oswald', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s;
        }

        .submit:hover {
            background: #7df3ff;
        }

        .submit:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .form-message {
            min-height: 1.2em;
            font-size: 0.85rem;
            text-align: center;
            color: #ff6b6b;
        }

        .form-message.info {
            color: rgba(255, 255, 255, 0.7);
        }

        .switch {
            font-size: 0.875rem;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.02em;
            text-align: center;
        }

        .switch a {
            font-weight: 500;
        }

        footer {
            padding: 16px 24px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            text-align: center;
        }

        .footer-links {
            display: flex;
            gap: 24px;
        }

        .footer-links a {
            color: rgba(255, 255, 255, 0.35);
            font-size: 0.7rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .footer-links a:hover {
            color: #00e5ff;
        }

        .copyright {
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.65rem;
            letter-spacing: 0.06em;
        }

        @media (max-width: 600px) {
            nav {
                padding: 1rem 1.25rem;
            }

            .nav-logo-icon {
                width: 36px;
                height: 36px;
            }

            main {
                justify-content: flex-start;
                gap: 22px;
                padding: 40px 24px 24px;
            }

            .logo {
                width: 88px;
                height: 88px;
            }

            .divider {
                width: 48px;
            }
        }

        .field-row {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .field-error {
            min-height: 0;
            font-size: 0.75rem;
            color: #ff6b6b;
            letter-spacing: 0.02em;
        }

        .field-error:empty {
            display: none;
        }

        .requirements {
            margin-top: -6px;
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 6px 18px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.55);
            letter-spacing: 0.02em;
        }

        .requirements li {
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }

        .requirements li::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            border: 1px solid currentColor;
        }

        .requirements li.met {
            color: #00e5ff;
        }

        .requirements li.met::before {
            background: currentColor;
        }

        .requirements li.unmet {
            color: #ff6b6b;
        }

        .checkbox.terms {
            align-items: flex-start;
            line-height: 1.5;
        }

        .checkbox.terms input {
            margin-top: 2px;
            flex-shrink: 0;
        }

        @media (max-width: 600px) {
            .field-row {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="nav-logo">
            <div class="nav-logo-icon"><img src="src/black_katt_transparent.png" alt="Black Katt Logo"></div>
            Black Katt
        </a>
        <a href="mailto:britt@blackkatt.ca?subject=Black%20Katt%20%E2%80%94%20General%20Inquiry" class="contact-link">Contact Us</a>
    </nav>
    <main>
        <div class="divider"></div>
        <div class="heading">
            <h1>Create Account</h1>
            <p class="subtitle">Join Black Katt</p>
        </div>
        <form id="sign-up-form" method="post" action="#" novalidate>
            <div class="field">
                <label class="field-label" for="name">Full name</label>
                <input id="name" name="name" type="text" placeholder="Your name" autocomplete="name" aria-describedby="name-error" required>
                <p class="field-error" id="name-error"></p>
            </div>
            <div class="field">
                <label class="field-label" for="email">Email</label>
                <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" aria-describedby="email-error" required>
                <p class="field-error" id="email-error"></p>
            </div>
            <div class="field-row">
                <div class="field">
                    <label class="field-label" for="password">Password</label>
                    <div class="password-wrap">
                        <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="new-password" aria-describedby="password-hint" required>
                        <button type="button" class="toggle-password" aria-label="Show password" aria-pressed="false" aria-controls="password">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>
                <div class="field">
                    <label class="field-label" for="confirm">Confirm password</label>
                    <input id="confirm" name="confirm" type="password" placeholder="••••••••" autocomplete="new-password" aria-describedby="confirm-error" required>
                    <p class="field-error" id="confirm-error"></p>
                </div>
            </div>
            <ul class="requirements" id="password-hint" aria-label="Password requirements">
                <li data-rule="length">At least 8 characters</li>
                <li data-rule="number">A number</li>
                <li data-rule="symbol">A symbol</li>
            </ul>
            <label class="checkbox terms" for="terms">
                <input id="terms" name="terms" type="checkbox" required>
                <span>I agree to the <a href="terms-of-service.html">Terms of Service</a> and <a href="privacy-policy.html">Privacy Policy</a></span>
            </label>
            <button type="submit" class="submit" disabled>Create Account</button>
            <p class="form-message" role="status" aria-live="polite"></p>
        </form>
        <p class="switch">Already have an account? <a href="sign-in.html">Sign in</a></p>
    </main>
    <footer>
        <div class="footer-links">
            <a href="privacy-policy.html">Privacy Policy</a>
            <a href="terms-of-service.html">Terms of Service</a>
        </div>
        <p class="copyright">&copy; 2026 Black Katt Technologies Inc. All rights reserved. Black Katt&trade; is a trademark of Black Katt Technologies Inc.</p>
    </footer>
    <script type="module" onerror="document.querySelector('.form-message').textContent = 'This form could not load. Check your connection or content blocker, then refresh.'">
        import {
            createUserWithEmailAndPassword,
            sendEmailVerification,
            updateProfile,
        } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';
        import { auth, authErrorMessage } from './src/firebase.js';

        document.querySelectorAll('.toggle-password').forEach((button) => {
            button.addEventListener('click', () => {
                const input = document.getElementById(button.getAttribute('aria-controls'));
                const show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                button.setAttribute('aria-pressed', String(show));
                button.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
            });
        });

        const form = document.getElementById('sign-up-form');
        const message = form.querySelector('.form-message');
        const submit = form.querySelector('.submit');
        const { name, email, password, confirm, terms } = form;
        const requirements = form.querySelectorAll('.requirements li');

        const EMAIL_PATTERN = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const passwordRules = {
            length: (value) => value.length >= 8,
            number: (value) => /\d/.test(value),
            symbol: (value) => /[^A-Za-z0-9]/.test(value),
        };

        // Each text field: how to validate it and what to say when it's wrong.
        const fields = [
            { input: name, valid: () => name.value.trim() !== '', error: 'Please enter your name.' },
            { input: email, valid: () => EMAIL_PATTERN.test(email.value.trim()), error: 'Please enter a valid email address.' },
            { input: password, valid: () => Object.values(passwordRules).every((rule) => rule(password.value)) },
            { input: confirm, valid: () => confirm.value !== '' && confirm.value === password.value, error: 'Passwords do not match.' },
        ];
        const touched = new Set();
        let submitting = false;

        function allValid() {
            return fields.every((field) => field.valid()) && terms.checked;
        }

        function update() {
            fields.forEach((field) => {
                const showError = touched.has(field.input) && !field.valid();
                field.input.setAttribute('aria-invalid', String(showError));
                const errorEl = document.getElementById(`${field.input.id}-error`);
                if (errorEl) {
                    errorEl.textContent = showError ? field.error : '';
                }
            });

            requirements.forEach((item) => {
                const met = passwordRules[item.dataset.rule](password.value);
                item.classList.toggle('met', met);
                item.classList.toggle('unmet', !met && touched.has(password));
            });

            submit.disabled = submitting || !allValid();
        }

        form.addEventListener('input', update);
        form.addEventListener('change', update);
        form.addEventListener('focusout', (event) => {
            if (fields.some((field) => field.input === event.target) && event.target.value !== '') {
                touched.add(event.target);
                update();
            }
        });

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            if (submitting || !allValid()) {
                return;
            }

            submitting = true;
            message.className = 'form-message';
            message.textContent = '';
            update();
            try {
                const { user } = await createUserWithEmailAndPassword(auth, email.value.trim(), password.value);
                // The account exists at this point; the account page can resend verification if this fails.
                await Promise.allSettled([
                    updateProfile(user, { displayName: name.value.trim() }),
                    sendEmailVerification(user),
                ]);
                window.location.assign('account.html');
            } catch (error) {
                message.textContent = authErrorMessage(error);
                submitting = false;
                update();
            }
        });

        // Browsers may autofill before any input event fires.
        update();
        window.addEventListener('pageshow', update);
    </script>
</body>
</html>
